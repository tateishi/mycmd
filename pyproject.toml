[project]
name = "mycmd"
version = "0.1.0"
description = "Add your description here"
license="MIT"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mycmd"]

[project.scripts]
mycmd = "mycmd.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
]
